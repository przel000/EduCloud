# EduCloud — private cloud lab stack
# Fresh reproducible demo is the primary path.
# Original Oct 2025 configs are preserved under archive/original/

name: educloud

services:
  nextcloud-db:
    image: mariadb:11.4
    container_name: nextcloud-db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW --innodb-file-per-table=1 --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - educloud
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    networks:
      - educloud
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nextcloud-app:
    image: nextcloud:29
    container_name: nextcloud-app
    restart: unless-stopped
    depends_on:
      nextcloud-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1 nextcloud-app nextcloud-app-2 nginx-lb
      REDIS_HOST: redis
      OVERWRITEPROTOCOL: http
    volumes:
      - nextcloud_html:/var/www/html
    networks:
      - educloud
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/status.php || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  nextcloud-app-2:
    image: nextcloud:29
    container_name: nextcloud-app-2
    restart: unless-stopped
    depends_on:
      nextcloud-app:
        condition: service_healthy
      nextcloud-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      OVERWRITEPROTOCOL: http
    volumes:
      - nextcloud_html:/var/www/html
    networks:
      - educloud
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/status.php || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  nginx-lb:
    image: nginx:1.27-alpine
    container_name: nginx-lb
    restart: unless-stopped
    depends_on:
      nextcloud-app:
        condition: service_healthy
      nextcloud-app-2:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx-lb/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - educloud
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  nextcloud-minio:
    # Official minio/minio pulls are currently unavailable in some regions;
    # cleanstart/minio is an S3-compatible MinIO build used for this lab.
    # cleanstart/minio only publishes `latest`; pin by digest at deploy time:
    #   docker pull cleanstart/minio:latest
    #   docker inspect cleanstart/minio:latest --format '{{index .RepoDigests 0}}'
    # Then replace `latest` with the sha256 digest for reproducible builds.
    image: cleanstart/minio:latest
    container_name: nextcloud-minio
    restart: unless-stopped
    user: "0:0"
    command: ["server", "/data", "--console-address", ":9001", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./minio-data:/data
    networks:
      - educloud
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: educloud-prometheus
    restart: unless-stopped
    depends_on:
      - cadvisor
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    networks:
      - educloud

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: educloud-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "${CADVISOR_PORT:-8081}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - educloud

networks:
  educloud:
    name: educloud_default
    driver: bridge

volumes:
  db_data:
  nextcloud_html:
  prometheus_data:
